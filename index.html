<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161824" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>kyunghwan.dev</title>
    <meta
      name="description"
      content="신경환 — 프로덕트 엔지니어 포트폴리오. 케이스 스터디 중심으로 의사결정과 임팩트를 정리합니다."
    />

    <!-- Open Graph / Twitter 기본값. useSeo 훅이 라우트별로 덮어씀. -->
    <meta property="og:site_name" content="kyunghwan.dev" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="kyunghwan.dev" />
    <meta
      property="og:description"
      content="신경환 — 프로덕트 엔지니어 포트폴리오. 케이스 스터디 중심으로 의사결정과 임팩트를 정리합니다."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      FOUC 방지: React가 마운트되기 전에 .dark 클래스를 결정한다.
      use-theme.ts의 STORAGE_KEY와 동기화돼있어야 한다 ("kw-theme").
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kw-theme");
          var sysDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") && sysDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage 비활성/SSR 환경 — 시스템 기본값으로 폴백 */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
